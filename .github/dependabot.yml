# Dependabot version updates. Security updates are enabled separately in the
# repository settings; this file adds routine version bumps so pinned versions
# (including the commit-SHA-pinned GitHub Actions) do not go stale.
#
# Every ecosystem is grouped into a single weekly PR so the Quality checks /
# CodeQL runs on that one PR validate the whole batch at once.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      web-dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "Web"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      android-dependencies:
        patterns: ["*"]
    ignore:
      # AGP / Kotlin majors change build behaviour; bump them deliberately.
      - dependency-name: com.android.application
        update-types: ["version-update:semver-major"]
      - dependency-name: org.jetbrains.kotlin.*
        update-types: ["version-update:semver-major"]
      # CodeQL java-kotlin extractor lags Kotlin; 2.4.20+ fails analysis
      # ("supports versions below 2.4.20"). Revisit when CodeQL catches up.
      - dependency-name: org.jetbrains.kotlin.*
        versions: [">=2.4.20"]
    commit-message:
      prefix: "Android"

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      workout-repair-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "Scripts"

  # Store release tooling (requirements-store.in → hash-locked requirements-store.txt),
  # installed by the release jobs that hold the App Store Connect and Play credentials.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      store-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "Store"

  # The iOS app's Swift packages are pinned in the Xcode project, which Dependabot's
  # swift ecosystem does not read (it needs a Package.swift with dependencies; the
  # only one, ios/Packages/LiteRTLM, declares checksum-pinned binaries). The
  # dependency graph still reports alerts for Package.resolved.
