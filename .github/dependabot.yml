# Dependabot version updates. Security updates are enabled separately in the
# repository settings; this file adds routine version bumps so pinned versions
# (including the commit-SHA-pinned GitHub Actions) do not go stale.
#
# Every ecosystem is grouped into a single weekly PR so the Quality checks /
# CodeQL runs on that one PR validate the whole batch at once.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      web-dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "Web"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      android-dependencies:
        patterns: ["*"]
    ignore:
      # AGP / Kotlin majors change build behaviour; bump them deliberately.
      - dependency-name: com.android.application
        update-types: ["version-update:semver-major"]
      - dependency-name: org.jetbrains.kotlin.*
        update-types: ["version-update:semver-major"]
      # CodeQL java-kotlin extractor lags Kotlin; 2.4.20+ fails analysis
      # ("supports versions below 2.4.20"). Revisit when CodeQL catches up.
      - dependency-name: org.jetbrains.kotlin.*
        versions: [">=2.4.20"]
    commit-message:
      prefix: "Android"

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      workout-repair-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "Scripts"

  # Store release tooling (requirements-store.in → hash-locked requirements-store.txt),
  # installed by the release jobs that hold the App Store Connect and Play credentials.
  - package-ecosystem: pip
    directory: /
    # Only the two root-level files above. Dependabot's pip support also reads
    # requirements files one folder down, so without this it bumped
    # scripts/requirements-workout-repair.txt here as well, duplicating the
    # /scripts entry's PR under a "Store" title. "*/**" is everything inside any
    # folder; a Python folder gets its own entry, like /scripts.
    exclude-paths:
      - "*/**"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      store-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "Store"

  # Not covered: the iOS app's Swift packages (RevenueCat, argmax, swift-argument-
  # parser) are pinned by the Xcode project's Package.resolved. Dependabot's swift
  # ecosystem needs a Package.swift that declares them (the only one,
  # ios/Packages/LiteRTLM, has checksum-pinned binaries and no dependencies), and
  # the dependency graph does not list that Package.resolved (checked 2026-10-14),
  # so they get neither alerts nor version updates: review their releases by hand.
